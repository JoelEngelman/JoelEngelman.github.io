<title>Games | Joel Engelman</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#080b16;
    color:white;
}

a{
    text-decoration:none;
    color:inherit;
}

/* ---------------- NAV ---------------- */

/* ---------------- HEADER ---------------- */

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:18px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(15,23,42,.92);
    backdrop-filter:blur(14px);
    z-index:1000;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo img{
    height:85px;
    width:auto;
    transition:.35s;
}

.logo img:hover{
    transform:scale(1.05);
}

nav{
    display:flex;
    gap:35px;
}

nav a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    position:relative;
    transition:.3s;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-6px;
    width:0%;
    height:2px;
    background:#8b5cf6;
    transition:.35s;
}

nav a:hover{
    color:#8b5cf6;
}

nav a:hover::after{
    width:100%;
}


/* ---------------- HERO ---------------- */

.hero{
    text-align:center;
    padding:70px 20px 50px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero p{
    max-width:700px;
    margin:auto;
    color:#b8bfd3;
    line-height:1.6;
}

/* ---------------- GAMES ---------------- */

.games{
    width:90%;
    max-width:1100px;
    margin:40px auto 80px;
}

.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.game-card{
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
}

.game-card:hover{
    transform:translateY(-6px);
    border-color:#8b5cf6;
}

.game-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.game-content{
    padding:22px;
}

.game-content h2{
    margin-bottom:12px;
    font-size:1.5rem;
}

.game-content p{
    color:#b8bfd3;
    line-height:1.6;
    margin-bottom:20px;
}

.play-button{
    display:inline-block;
    background:#8b5cf6;
    color:white;
    padding:10px 22px;
    border-radius:10px;
    transition:.2s;
    font-weight:bold;
}

.play-button:hover{
    background:#7443e6;
}

footer{
    text-align:center;
    padding:35px;
    color:#777;
    border-top:1px solid rgba(255,255,255,.08);
}

</style>
</head>
<body>
