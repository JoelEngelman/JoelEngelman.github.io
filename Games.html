<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Games | Joel Engelman</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#080b16;
    color:white;
}

a{
    text-decoration:none;
    color:inherit;
}

/* ---------------- NAV ---------------- */

nav{
    width:100%;
    padding:20px 8%;
}

/* Paste your navigation here */

/* ---------------- HERO ---------------- */

.hero{
    text-align:center;
    padding:70px 20px 50px;
}

.hero h1{
    font-size:3rem;
    margin-bottom:15px;
}

.hero p{
    max-width:700px;
    margin:auto;
    color:#b8bfd3;
    line-height:1.6;
}

/* ---------------- GAMES ---------------- */

.games{
    width:90%;
    max-width:1100px;
    margin:40px auto 80px;
}

.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.game-card{
    background:#111827;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    overflow:hidden;
    transition:.25s;
}

.game-card:hover{
    transform:translateY(-6px);
    border-color:#8b5cf6;
}

.game-card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.game-content{
    padding:22px;
}

.game-content h2{
    margin-bottom:12px;
    font-size:1.5rem;
}

.game-content p{
    color:#b8bfd3;
    line-height:1.6;
    margin-bottom:20px;
}

.play-button{
    display:inline-block;
    background:#8b5cf6;
    color:white;
    padding:10px 22px;
    border-radius:10px;
    transition:.2s;
    font-weight:bold;
}

.play-button:hover{
    background:#7443e6;
}

footer{
    text-align:center;
    padding:35px;
    color:#777;
    border-top:1px solid rgba(255,255,255,.08);
}

</style>
</head>
<body>

<!-- ================= NAVIGATION ================= -->

<nav>

<!-- Paste your navigation here -->

</nav>

<!-- ================= HERO ================= -->

<section class="hero">

<h1>Games</h1>

<p>
<!-- Put your page description here -->
</p>

</section>

<!-- ================= GAMES ================= -->

<section class="games">

<div class="games-grid">

    <!-- ===== COPY THIS CARD TO ADD MORE GAMES ===== -->

    <div class="game-card">

        <img src="Screenshot_2-8-2026_12419_scratch.mit.edu.jpeg" alt="Geometry Jump">

        <div class="game-content">

            <h2>Geometry Jump</h2>

            <p>
                This is an example description for your game. Replace this with whatever you want.
            </p>

            <a href="GEOMETRY%20JUMP%20(Mobile-Friendly)%20v.1%20(3).html" class="play-button">
                Play Game →
            </a>

        </div>

    </div>

    <!-- ===== END CARD ===== -->

</div>

</section>

<footer>
© 2026 Joel Engelman
</footer>

</body>
</html>
