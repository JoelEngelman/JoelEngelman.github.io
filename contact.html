<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About | Joel Engelman</title>

<style>



*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7fb;
    color:#333;
}

header{
    background:#111827;
    color:white;
    padding:20px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:32px;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    transition:.3s;
}

nav a:hover{
    color:#60a5fa;
}

.hero{
    background:linear-gradient(135deg,#2563eb,#1e3a8a);
    color:white;
    text-align:center;
    padding:90px 20px;
}

.hero h2{
    font-size:58px;
    margin-bottom:20px;
}

.hero p{
    max-width:700px;
    margin:auto;
    font-size:20px;
    line-height:1.7;
}

.container{
    width:90%;
    max-width:1100px;
    margin:60px auto;
}

.card{
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    margin-bottom:35px;
}

.card h3{
    font-size:32px;
    margin-bottom:20px;
}

.card p{
    color:#555;
    line-height:1.8;
    font-size:18px;
}

.timeline{
    display:grid;
    gap:20px;
}

.event{
    background:#eef4ff;
    border-left:5px solid #2563eb;
    padding:20px;
    border-radius:10px;
}

.event h4{
    margin-bottom:10px;
}

footer{
    background:#111827;
    color:white;
    text-align:center;
    padding:30px;
    margin-top:70px;
}
